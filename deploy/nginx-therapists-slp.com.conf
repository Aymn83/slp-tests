# النطاق الرئيسي للموقع — therapists-slp.com
# ضعه في: /etc/nginx/sites-available/therapists-slp  ثم فعّله بـ symlink إلى sites-enabled
# بعد التفعيل: certbot --nginx -d therapists-slp.com -d www.therapists-slp.com  (يضيف SSL تلقائياً)

server {
    listen 80;
    listen [::]:80;
    server_name therapists-slp.com www.therapists-slp.com;

    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
