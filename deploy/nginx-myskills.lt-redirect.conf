# myskills.lt أصبح نطاقاً قديماً: يحوّل كل طلب (بنفس المسار) إلى therapists-slp.com تحويلاً دائماً (301)
# يحلّ محل /etc/nginx/sites-available/slp-tests بعد تفعيل النطاق الجديد (انظر DEPLOY.md، الخطوة 14)
# يستخدم شهادة myskills.lt الموجودة، فتبقى روابط https://myskills.lt/... القديمة تعمل وتُحوَّل.

server {
    listen 80;
    listen [::]:80;
    server_name myskills.lt www.myskills.lt;
    return 301 https://therapists-slp.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name myskills.lt www.myskills.lt;

    ssl_certificate /etc/letsencrypt/live/myskills.lt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myskills.lt/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://therapists-slp.com$request_uri;
}
